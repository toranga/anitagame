<style>

  #loadbar{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#071018;color:#ffe08a;font:800 22px Arial}

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/GLTFLoader.js";

const TITLE = "SPOOKY FOREST";
document.title = TITLE;
document.getElementById("topname").textContent = TITLE;

/* ---------------------------------------------------------------- hero
   The Hero is an original character. Colors, face paintings, and the mesh
   builder live in this one block so a new design can replace them together.
   buildHero() returns a group whose animated parts are named:
   head, face, torso, armL, armR, legL, legR, cape, lassoLight.
   Face textures: happy (day), scared (night, monster near), peek (hiding),
   terrified (jumpscare).
---------------------------------------------------------------- */
const HERO = {
  name: "the Hero",
  colors: {
    skin: 0xc68642,
    hair: 0x3a2418,
    clothRed: 0xc4202a,
    clothBlue: 0x2a4db5,
    gold: 0xe6b23c,
    boot: 0xb11222,
    cape: 0xb10f1e,
  },
};

function paintFace(kind) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  g.clearRect(0, 0, 256, 256);
  const eye = (x, y, s, pupil) => {
    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(x, y, 44 * s, 50 * s, 0, 0, 7); g.fill();
    g.fillStyle = "#6b3a1e";
    g.beginPath(); g.arc(x, y + 1, 32 * s, 0, 7); g.fill();
    g.fillStyle = "#1a0c08";
    g.beginPath(); g.arc(x, y + 2, pupil, 0, 7); g.fill();
    g.fillStyle = "#fff";
    g.beginPath(); g.arc(x - 10, y - 12, 8 * s, 0, 7); g.fill();
  };
  const brow = (x, y, tilt) => {
    g.strokeStyle = "#3a2418"; g.lineWidth = 10; g.lineCap = "round";
    g.beginPath(); g.moveTo(x - 40, y); g.quadraticCurveTo(x, y + tilt, x + 40, y); g.stroke();
  };
  if (kind === "happy") {
    eye(72, 118, 1.15, 12); eye(184, 118, 1.15, 12);
    brow(72, 52, 16); brow(184, 52, 16);
    g.fillStyle = "#ffb0b8"; g.globalAlpha = 0.55;
    g.beginPath(); g.arc(40, 158, 22, 0, 7); g.arc(216, 158, 22, 0, 7); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = "#c45252";
    g.beginPath(); g.ellipse(128, 176, 48, 26, 0, 0.08, Math.PI - 0.08); g.fill();
    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(128, 184, 34, 16, 0, 0, Math.PI); g.fill();
  } else if (kind === "scared") {
    eye(68, 108, 1.32, 7); eye(188, 108, 1.32, 7);
    brow(68, 46, -26); brow(188, 46, -26);
    g.fillStyle = "#2a120c";
    g.beginPath(); g.ellipse(128, 186, 16, 22, 0, 0, 7); g.fill();
    g.fillStyle = "#8fd4ff";
    g.beginPath(); g.ellipse(214, 58, 10, 18, 0.4, 0, 7); g.fill();
  } else if (kind === "peek") {
    g.fillStyle = "rgba(198,134,66,0.92)";
    g.fillRect(0, 0, 256, 118);
    eye(74, 150, 1.35, 7); eye(182, 150, 1.35, 7);
    brow(74, 96, -18); brow(182, 96, -18);
  } else {
    eye(68, 90, 1.42, 5); eye(188, 90, 1.42, 5);
    brow(68, 18, -32); brow(188, 18, -32);
    g.fillStyle = "#1a0c08";
    g.beginPath(); g.ellipse(128, 188, 22, 30, 0, 0, 7); g.fill();
    g.fillStyle = "#8fd4ff";
    g.beginPath(); g.ellipse(220, 52, 12, 18, 0.4, 0, 7); g.fill();
    g.beginPath(); g.ellipse(36, 64, 10, 16, -0.4, 0, 7); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function starGeo(outer, inner) {
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    const r = i % 2 === 0 ? outer : inner;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
  }
  sh.closePath();
  return new THREE.ExtrudeGeometry(sh, { depth: 0.05, bevelEnabled: false });
}

function skirtTexture() {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#2346b0";
  g.fillRect(0, 0, 512, 128);
  g.fillStyle = "#f4f7ff";
  for (let i = 0; i < 10; i++) {
    const x = 28 + i * 50, y = i % 2 ? 78 : 40;
    g.save(); g.translate(x, y); g.rotate(Math.PI / 2);
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = (k * Math.PI) / 5 - Math.PI / 2;
      const r = k % 2 === 0 ? 14 : 6;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.fill(); g.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

function gfxChoiceNow() {
  try {
    const v = localStorage.getItem("spooky-gfx");
    if (v === "low" || v === "med" || v === "high" || v === "auto") return v;
  } catch (e) {}
  return "auto";
}
function gfxTier() {
  const choice = gfxChoiceNow();
  if (choice === "low" || choice === "med" || choice === "high") return choice;
  return "med";
}
function gfxProfile() {
  const tier = gfxTier();
  if (tier === "low") return { shadow: 0, grass: 0, pixel: 0.6, fireflies: 0.4 };
  if (tier === "high") return { shadow: 256, grass: 1400, pixel: 1, fireflies: 1 };
  return { shadow: 0, grass: 0, pixel: 0.55, fireflies: 0.75 };
}
function lambert(color, extra) {
  const plain = Object.assign({ color }, extra || {});
  delete plain.roughness;
  delete plain.metalness;
  delete plain.normalMap;
  delete plain.roughnessMap;
  return new THREE.MeshLambertMaterial(plain);
}

function buildHero() {
  const C = HERO.colors;
  const g = new THREE.Group();
  g.name = "hero";
  const skin = lambert(C.skin);
  const hairM = lambert(C.hair);
  const red = lambert(C.clothRed);
  const gold = lambert(C.gold);
  const capeM = lambert(C.cape, { side: THREE.DoubleSide });

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.42, 4, 10), red);
  torso.name = "torso";
  torso.position.y = 1.05;
  torso.scale.set(1.42, 1.08, 0.9);
  g.add(torso);
  const chevL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.045, 0.04), gold);
  chevL.position.set(-0.1, 1.18, 0.22);
  chevL.rotation.z = 0.7;
  const chevR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.045, 0.04), gold);
  chevR.position.set(0.1, 1.18, 0.22);
  chevR.rotation.z = -0.7;
  g.add(chevL, chevR);
  const star = new THREE.Mesh(starGeo(0.07, 0.03), lambert(0xd0122a));
  star.position.set(0, 1.12, 0.28);
  g.add(star);

  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.5, 0.32, 16, 1, true), lambert(0xffffff, { map: skirtTexture(), side: THREE.DoubleSide }));
  skirt.position.y = 0.78;
  g.add(skirt);
  const hem = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.025, 6, 18), gold);
  hem.rotation.x = Math.PI / 2;
  hem.position.y = 0.63;
  g.add(hem);

  const head = new THREE.Group();
  head.name = "head";
  head.position.y = 1.62;
  g.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), skin);
  skull.scale.set(1, 1.05, 0.96);
  head.add(skull);
  const faceMat = new THREE.MeshBasicMaterial({ map: paintFace("happy"), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.336, 24, 16, Math.PI / 2 - 0.72, 1.44, 1.05, 1.05), faceMat);
  face.name = "face";
  face.scale.set(1, 1.05, 0.96);
  head.add(face);
  const hair = new THREE.Group();
  hair.name = "hair";
  const puff = (x, y, z, sx, sy, sz) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 10), hairM);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); hair.add(m);
  };
  puff(0, 0.1, -0.18, 1.4, 0.55, 1.1);
  puff(-0.28, -0.2, 0.02, 0.5, 1.45, 0.55);
  puff(0.28, -0.2, 0.02, 0.5, 1.45, 0.55);
  puff(0, -0.62, -0.12, 0.62, 1.5, 0.5);
  head.add(hair);
  const tiara = new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.022, 6, 16, Math.PI), gold);
  tiara.name = "tiara";
  tiara.rotation.x = 0.42;
  tiara.position.set(0, 0.07, 0.2);
  tiara.renderOrder = 3;
  head.add(tiara);
  const gem = new THREE.Mesh(starGeo(0.055, 0.024), lambert(0xd0122a));
  gem.position.set(0, 0.2, 0.3);
  head.add(gem);

  function limb(name, x, y, len, rad, mat) {
    const pivot = new THREE.Group();
    pivot.name = name;
    pivot.position.set(x, y, 0);
    const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 3, 8), mat);
    mesh.position.y = -len * 0.5 - rad;
    pivot.add(mesh);
    g.add(pivot);
    return pivot;
  }
  const armL = limb("armL", -0.4, 1.34, 0.46, 0.11, skin);
  const armR = limb("armR", 0.36, 1.32, 0.42, 0.09, skin);
  for (const arm of [armL, armR]) {
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.11, 0.12, 10), gold);
    cuff.position.y = -0.42;
    arm.add(cuff);
  }
  const legL = limb("legL", -0.14, 0.72, 0.28, 0.1, skin);
  const legR = limb("legR", 0.14, 0.72, 0.28, 0.1, skin);
  for (const leg of [legL, legR]) {
    const boot = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.36, 3, 8), lambert(C.boot));
    boot.position.y = -0.62;
    leg.add(boot);
    const trim = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.025, 6, 12), gold);
    trim.rotation.x = Math.PI / 2;
    trim.position.y = -0.4;
    leg.add(trim);
    const bstar = new THREE.Mesh(starGeo(0.06, 0.028), gold);
    bstar.position.set(0, -0.55, 0.12);
    leg.add(bstar);
  }

  const cape = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 1.15, 8, 10), capeM);
  cape.name = "cape";
  cape.position.set(0, 0.82, -0.28);
  g.add(cape);
  cape.userData.base = cape.geometry.attributes.position.clone();

  const lasso = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.028, 8, 24), new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0xffc14a, emissiveIntensity: 1.4, roughness: 0.25, metalness: 0.35 }));
  lasso.position.set(0.46, 0.82, 0.22);
  lasso.rotation.y = 0.4;
  lasso.rotation.x = 0.4;
  g.add(lasso);
  const lassoLight = new THREE.PointLight(0xffc85a, 0.2, 5);
  lassoLight.name = "lassoLight";
  lassoLight.position.copy(lasso.position);
  g.add(lassoLight);
  g.userData.lasso = lasso;

  HERO.textures = {
    happy: paintFace("happy"),
    scared: paintFace("scared"),
    peek: paintFace("peek"),
    terrified: paintFace("terrified"),
  };
  return g;
}

/* ---------------------------------------------------------------- world */
const DAY = 120, DUSK = 15, NIGHT = 180, DAWN = 15;
const CYCLE = DAY + DUSK + NIGHT + DAWN;
const LANTERN_SPOTS = [
  { x: 9, z: 16 }, { x: -11, z: 28 }, { x: 13, z: 40 }, { x: -7, z: 52 },
  { x: 12, z: 64 }, { x: -12, z: 76 }, { x: 4, z: 90 },
];
const BUSHES = [
  { x: -6, z: 8, r: 2.1 }, { x: 8, z: 22, r: 2.1 }, { x: -10, z: 36, r: 2.2 },
  { x: 9, z: 48, r: 2.1 }, { x: -8, z: 60, r: 2.2 }, { x: 11, z: 74, r: 2.1 },
  { x: -5, z: 86, r: 2.2 },
];
const ROCKS = [
  { x: 11, z: 15 }, { x: -13, z: 27 }, { x: 15, z: 39 }, { x: -9, z: 51 },
  { x: 14, z: 63 }, { x: -14, z: 75 }, { x: 6, z: 89 }, { x: 20, z: 44 }, { x: -18, z: 58 },
];

function pathX(z) { return Math.sin(z * 0.045) * 7; }
function pathDist(x, z) { return Math.abs(x - pathX(z)); }
function groundY(x, z) {
  const roll = Math.sin(x * 0.07) * 1.7 + Math.cos(z * 0.05) * 1.25 + Math.sin((x + z) * 0.03) * 0.7;
  const d = pathDist(x, z);
  const path = Math.max(0, 1 - d / 3.4);
  return roll * (1 - path * 0.85);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7);
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

const keys = {};
const pressed = {};
const heldBy = { key: {}, pad: {}, touch: {} };
function recompute(k) {
  const on = !!(heldBy.key[k] || heldBy.pad[k] || heldBy.touch[k]);
  if (on) { if (!keys[k]) pressed[k] = true; keys[k] = true; }
  else keys[k] = false;
}
function setHeld(src, k, down) {
  const bag = heldBy[src];
  const next = !!down;
  if (!!bag[k] === next) return;
  if (next) bag[k] = true; else delete bag[k];
  recompute(k);

const KEYMAP = {

function setExpression(name) {
  expression = name;
  const face = hero.getObjectByName("face");
  if (face && face.material && HERO.textures[name]) face.material.map = HERO.textures[name];
  const scared = name === "scared" || name === "terrified" || name === "peek";
  hero.traverse((obj) => {
    if (!obj.morphTargetDictionary || obj.morphTargetDictionary.fear === undefined) return;
    obj.morphTargetInfluences[obj.morphTargetDictionary.fear] = scared ? 1 : 0;
  });
}
function playClip(bag, name) {
  if (!bag || !bag.map[name] || bag.current === name) return;
  const next = bag.map[name];
  const prev = bag.current && bag.map[bag.current];
  if (prev) prev.fadeOut(0.15);
  next.reset().fadeIn(0.15).play();
  bag.current = name;
}

function poseHero(dt, moving, hostile) {
  if (hero.userData.mixer) {
    let expr = "happy";
    const md = Math.hypot(mon.x - player.x, mon.z - player.z);
    if (state === "scare" && scareKind === "catch") expr = "terrified";
    else if (hiding && hostile && md < 12) expr = "peek";
    else if (hostile && (md < 15 || mon.mode === "chase")) expr = "scared";
    setExpression(expr);
    const scaredNow = expr === "scared" || expr === "terrified";
    let clip = "idle";
    if (lassoT > 0) clip = "lasso";
    else if (player.hop > 0.05) clip = "jump";
    else if (hiding) clip = "crouch";
    else if (scaredNow && moving) clip = "scared_run";
    else if (scaredNow) clip = "scared_idle";
    else if (moving && keys.sprint) clip = "run";
    else if (moving) clip = "walk";
    playClip(hero.userData.clips, clip);
    hero.userData.mixer.update(dt);
    const ll = hero.getObjectByName("lassoLight");
    if (ll) ll.intensity = lassoT > 0 ? 3.2 : 0.25 + nightFactor * 2.1;
    hero.rotation.x = 0;
    hero.rotation.z = 0;
    return;
  }
  const armL = hero.getObjectByName("armL");
  const armR = hero.getObjectByName("armR");
  const legL = hero.getObjectByName("legL");
  const legR = hero.getObjectByName("legR");
  const head = hero.getObjectByName("head");
  const cape = hero.getObjectByName("cape");
  const swing = Math.sin(walkT) * (moving ? 0.7 : 0.08);
  let expr = "happy";
  const md = Math.hypot(mon.x - player.x, mon.z - player.z);
  if (state === "scare" && scareKind === "catch") expr = "terrified";
  else if (hiding && hostile && md < 12) expr = "peek";
  else if (hostile && (md < 15 || mon.mode === "chase")) expr = "scared";
  setExpression(expr);
  const scaredNow = expr === "scared" || expr === "terrified";
  const wobble = scaredNow ? Math.sin(performance.now() / 70) * 0.03 : 0;
  if (armL && armR && legL && legR && head) {
    legL.rotation.set(scaredNow ? 0.1 : swing, 0, 0);
    legR.rotation.set(scaredNow ? -0.06 : -swing, 0, 0);
    head.rotation.set(wobble * 0.4, 0, wobble);
    if (scaredNow) {
      armL.rotation.set(-0.4 + wobble, 0, -1.05);
      armR.rotation.set(-0.4 - wobble, 0, 1.05);
      head.rotation.x = -0.12 + wobble;
    } else if (expr === "peek") {
      armL.rotation.set(0.35, 0, 0.2);
      armR.rotation.set(0.35, 0, -0.2);
      head.rotation.x = 0.15;
    } else if (state === "title" || !moving) {
      armL.rotation.set(0.7, 0, 0.35);
      armR.rotation.set(0.7, 0, -0.35);
      if (mon.wave > 0 && !hostile) armR.rotation.x = -0.9 + Math.sin(performance.now() / 180) * 0.2;
    } else {
      armL.rotation.set(-swing, 0, 0.12);
      armR.rotation.set(swing, 0, -0.12);
    }
  }
  hero.rotation.x = 0;
  hero.rotation.z = 0;
  if (cape && cape.userData.base) {
    const pos = cape.geometry.attributes.position;
    const base = cape.userData.base;
    const t = performance.now() / 400;
    for (let i = 0; i < pos.count; i++) {
      const y = base.getY(i);
      const hang = (0.7 - y) / 1.4;
      pos.setZ(i, base.getZ(i) - Math.abs(Math.sin(t + base.getX(i) * 2)) * 0.22 * hang * (1 + (moving ? 0.6 : 0)));
    }
    pos.needsUpdate = true;
  }
  const lasso = hero.userData.lasso;
  if (lasso) {
    if (lassoT > 0) {
      const u = 1 - lassoT / 0.55;
      const ang = -1.1 + u * 2.4;
      lasso.position.set(Math.sin(ang) * 0.85, 1.2, 0.35 + Math.cos(ang) * 0.55);
      lasso.rotation.set(1.1, ang, u * 6);
      lasso.scale.setScalar(1.8);
    } else {
      lasso.position.set(0.46, 0.82, 0.22);
      lasso.rotation.set(0.4, 0.4, Math.sin(performance.now() / 500) * 0.25);
      lasso.scale.setScalar(1);
    }
  }
  const ll = hero.getObjectByName("lassoLight");
  if (ll) {
    ll.intensity = lassoT > 0 ? 3.2 : 0.25 + nightFactor * 2.1;
    if (lasso) ll.position.copy(lasso.position);
  }
  if (scaredNow && hostile) hero.position.y += Math.sin(performance.now() / 60) * 0.01;
}

function poseMonster(dt, moving, hostile) {
  if (monster.userData.mixer) {
    let clip = "idle";
    if (state === "scare") clip = "lunge";
    else if (hostile && (mon.mode === "chase" || moving)) clip = "chase";
    else if (hostile) clip = "stalk";
    else if (mon.wave > 0) clip = "wave";
    else if (moving) clip = "stalk";
    playClip(monster.userData.clips, clip);
    monster.userData.mixer.update(dt);
    monster.traverse((obj) => {
      if (!obj.morphTargetDictionary || obj.morphTargetDictionary.night === undefined) return;
      obj.morphTargetInfluences[obj.morphTargetDictionary.night] = hostile ? 1 : 0;
    });
    monster.position.set(mon.x, groundY(mon.x, mon.z), mon.z);
    monster.rotation.y = mon.yaw;
    return;
  }
  const armL = monster.getObjectByName("armL");
  const armR = monster.getObjectByName("armR");
  const legL = monster.getObjectByName("legL");
  const legR = monster.getObjectByName("legR");
  const head = monster.getObjectByName("head");
  const swing = Math.sin(monsterWalk) * (moving ? 0.8 : 0.1);
  if (legL) legL.rotation.x = swing;
  if (legR) legR.rotation.x = -swing;
  if (armL) armL.rotation.x = -swing;
  if (armR) armR.rotation.x = swing * 0.6;
  if (armL) armL.rotation.z = 0;
  if (armR) armR.rotation.z = 0;
  if (!hostile && mon.wave > 0 && armR) armR.rotation.x = -1.1 + Math.sin(performance.now() / 180) * 0.25;
  if (head) {
    const jitter = hostile ? Math.sin(performance.now() / 40) * 0.08 : 0;
    head.rotation.set(jitter * 0.4, 0, stunT > 0 ? Math.sin(performance.now() / 50) * 0.25 : jitter + (!hostile ? Math.sin(performance.now() / 500) * 0.06 : 0));
  }
  monster.position.set(mon.x, groundY(mon.x, mon.z) + Math.abs(Math.sin(monsterWalk)) * 0.05, mon.z);
  monster.rotation.y = mon.yaw;
}

function layoutTitle() {
  const dayTitle = startAt !== "night";
  cycleT = dayTitle ? 6 : DAY + DUSK + 6;
  applySky();
  hero.position.set(-1.15, groundY(-1.15, 0), 0);
  hero.rotation.set(0, 0.45, 0);
  mon.x = 1.25; mon.z = 0.15; mon.yaw = -0.6; mon.wave = 1;
  monster.position.set(mon.x, groundY(mon.x, mon.z), mon.z);
  poseHero(0.016, false, !dayTitle);
  poseMonster(0.016, false, !dayTitle);
  hero.position.y = groundY(-1.15, 0);
  camera.position.set(0.1, 1.85, 5.15);
  camera.lookAt(0.05, 1.25, 0);
}

function startGame() {
  audio();
  state = "play";
  lives = 3;
  collected = 0;
  hiding = false;
  stamina = 1;
  fp = false;
  invuln = 0;
  surprises = 0;
  lastSurprise = -999;
  heroYaw = cameraYaw;
  camYaw = cameraYaw;
  camPitch = 0;
  vel.x = 0;
  vel.z = 0;
  lassoT = 0;
  lassoCd = 0;
  stunT = 0;
  stunUsed = false;
  pulls.length = 0;
  ropeBeads.forEach((b) => { b.visible = false; });
  playTime = 0;
  talkT = 0;
  hintT = 0;
  spotT = 0;
  wasChasing = false;
  gateOpen = false;
  doorAngle = 0;
  lanterns.forEach((l) => { l.got = false; l.mesh.visible = true; });
  player.x = pathX(3); player.z = 3; player.hop = 0;
  lastLantern = { x: player.x, z: player.z };
  mon.x = pathX(36) + 6; mon.z = 36; mon.mode = "wander"; mon.tx = pathX(50); mon.tz = 50;
  cycleT = startAt === "night" ? DAY + DUSK + 4 : 4;
  transformed = startAt === "night";
  topname.style.display = "none";
  showPanel(false);
  hint("A jumps. X acts. B or RB lassos. LT sprints.", 3600);
}
let doorAngle = 0;

function interact() {
  let best = null, bd = 2.3 * 2.3;
  for (const l of lanterns) if (!l.got) {
    const d = dist2(player.x, player.z, l.x, l.z);
    if (d < bd) { bd = d; best = l; }
  }
  if (best) {
    best.got = true;
    best.mesh.visible = false;
    collected = lanterns.filter((l) => l.got).length;
    lastLantern = { x: best.x, z: best.z };
    tone(660, 0.12, "triangle", 0.08, 1320);
    setTimeout(() => tone(990, 0.18, "sine", 0.07), 90);
    hint("Lantern " + collected + " of 7");
    return;
  }
  if (inBush(player.x, player.z)) {
    hiding = !hiding;
    hint(hiding ? "Hiding in the bush" : "You step out");
    return;
  }
  if (nightFactor < 0.55 && Math.hypot(mon.x - player.x, mon.z - player.z) < 3.6) {
    talkLine = LINES[lineI % LINES.length];
    lineI++;
    talkT = 4.5;
    hintT = 8;
    setBubble(bubble, talkLine);
    tone(520, 0.08, "triangle", 0.06, 740);
  }
}

function beginScare(kind) {
  state = "scare";
  scareT = 0;
  scareKind = kind;
  hiding = false;
  if (jumpscareMode !== "mild") scream();
  if (kind === "surprise") { surprises++; lastSurprise = playTime; }
}
function endScare() {
  flash.style.opacity = "0";
  flash.style.background = "#ff1a1a";
  scareHead.visible = false;
  scareLight.intensity = 0;
  scareCamReady = false;
  if (scareKind === "surprise") {
    mon.mode = "flee";
    mon.flee = 2.4;
    state = "play";
    return;
  }
  lives--;
  invuln = 2.2;
  player.x = lastLantern.x; player.z = lastLantern.z; player.hop = 0;
  mon.x = player.x + 16; mon.z = player.z + 8; mon.mode = "wander";
  if (lives <= 0) { state = "dead"; showPanel(true); }
  else { state = "play"; hint(lives + (lives === 1 ? " life left" : " lives left")); }
}

function triggerSurprise() {
  let tree = trunks[0], bd = 1e9;
  for (const t of trunks) {
    const d = dist2(t.x, t.z, player.x, player.z);
    if (d > 16 && d < 120 && d < bd) { bd = d; tree = t; }
  }
  if (!tree) tree = { x: player.x + 4, z: player.z };
  const dx = tree.x - player.x, dz = tree.z - player.z;
  const len = Math.hypot(dx, dz) || 1;
  mon.x = tree.x + (dx / len) * 0.8;
  mon.z = tree.z + (dz / len) * 0.8;
  mon.yaw = Math.atan2(player.x - mon.x, player.z - mon.z);
  beginScare("surprise");
}

function paintPadDebug() {
  const el = document.getElementById("pad-debug");
  if (!el) return;
  el.style.display = debugOn ? "block" : "none";
  if (!debugOn) return;
  const f = (n) => (Number.isFinite(n) ? n : 0).toFixed(3);
  el.textContent = [
    "path " + padRaw.path + "   hold Select 2s to hide",
    "raw L " + f(padRaw.lx) + " " + f(padRaw.ly) + "   R " + f(padRaw.rx) + " " + f(padRaw.ry),
    "hat " + f(padRaw.hatX) + " " + f(padRaw.hatY) + "   L2 " + f(padRaw.l2) + " R2 " + f(padRaw.r2),
    "right stick page X " + f(padRaw.rx) + "  Y " + f(padRaw.ry),
    "right stick curved X " + f(lookTarget.x) + "  Y " + f(lookTarget.y),
    "native right X " + f(axisNum(window.__nativeRightX)) + "  Y " + f(axisNum(window.__nativeRightY)),
    "curved move L " + f(stickTarget.x) + " " + f(stickTarget.y),
    "positive right-X turns right. negative right-Y looks up.",
    "positive left-X moves to the right of the screen.",
    "invert camera X " + (invertX ? "ON" : "OFF") + "  Y " + (invertY ? "ON" : "OFF") + "  move X " + (invertMoveX ? "ON" : "OFF"),
  ].join("\n");
}
function hint(text, ms) {
  hintEl.style.display = "block";
  hintEl.textContent = text;
  hintEl.dataset.until = String(performance.now() + (ms || 2200));
}
function damp(a, b, dt, rate) {
  return a + (b - a) * (1 - Math.exp(-rate * dt));
}
function dampAngle(a, b, dt, rate) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * (1 - Math.exp(-rate * dt));
}
function sensMul() {
  return stickSens === "low" ? 0.7 : stickSens === "high" ? 1.35 : 1;
}
function updateCamera(dt, moving) {
  const looking = Math.hypot(lookTarget.x, lookTarget.y) > 0.02 || Math.abs(lookDX) + Math.abs(lookDY) > 0.4;
  if (looking) lookIdle = 0;
  else lookIdle += dt;
  const mul = sensMul();
  const xSign = invertX ? -1 : 1;
  const ySign = invertY ? -1 : 1;
  // Increasing yaw slides a fixed object toward screen-right, which is a
  // left turn. Stick-right and mouse-right subtract from yaw so the view turns right.
  camYaw -= lookTarget.x * xSign * 3 * mul * dt;
  camYaw -= lookDX * 0.005;
  camPitch = clamp(camPitch - lookTarget.y * ySign * 2 * mul * dt - lookDY * 0.003, -0.85, 0.7);
  lookDX = 0;
  lookDY = 0;
  if (pressed.recenter) {
    camYaw = heroYaw;
    camPitch = 0;
    lookIdle = 0;
  } else if (camFollow && moving && lookIdle > 2) {
    camYaw = dampAngle(camYaw, heroYaw, dt, 1.2);
  }
  cameraYaw = camYaw;
  cameraPitch = camPitch;
}
function tryLasso() {
  if (state !== "play" || lassoCd > 0 || lassoT > 0) return;
  lassoT = 0.55;
  lassoCd = 0.85;
  tone(660, 0.1, "triangle", 0.07, 990);
  noiseBurst(0.12, 0.06, 400);
  const fx = Math.sin(heroYaw), fz = Math.cos(heroYaw);
  for (const l of lanterns) {
    if (l.got || pulls.some((p) => p.lantern === l)) continue;
    const dx = l.x - player.x, dz = l.z - player.z;
    const d = Math.hypot(dx, dz);
    if (d > 6 || d < 0.15) continue;
    if ((dx * fx + dz * fz) / d < 0.4) continue;
    pulls.push({ lantern: l, t: 0, x: l.x, z: l.z, y: l.mesh.position.y });
  }
  if (nightFactor > 0.55 && !stunUsed) {
    const dx = mon.x - player.x, dz = mon.z - player.z;
    const d = Math.hypot(dx, dz) || 0.001;
    if (d < 6.5 && (dx * fx + dz * fz) / d > 0.25) {
      stunT = 2;
      stunUsed = true;
      hint("The lasso stunned him!");
      tone(160, 0.35, "sawtooth", 0.07, 50);
    }
  }
}
function showRope(ax, ay, az, bx, by, bz) {
  for (let i = 0; i < ropeBeads.length; i++) {
    const t = (i + 1) / (ropeBeads.length + 1);
    const bead = ropeBeads[i];
    bead.visible = true;
    bead.position.set(ax + (bx - ax) * t, ay + (by - ay) * t + Math.sin(t * Math.PI) * 0.55, az + (bz - az) * t);
  }
}
function updatePulls(dt, gy) {
  for (let i = pulls.length - 1; i >= 0; i--) {
    const p = pulls[i];
    p.t += dt / 0.42;
    const k = clamp(p.t, 0, 1);
    const ease = k * k * (3 - 2 * k);
    p.lantern.mesh.position.set(
      p.x + (player.x - p.x) * ease,
      p.y + (gy + 1.15 - p.y) * ease + Math.sin(k * Math.PI) * 1.35,
      p.z + (player.z - p.z) * ease
    );
    if (k >= 1) {
      p.lantern.got = true;
      p.lantern.mesh.visible = false;
      lastLantern = { x: player.x, z: player.z };
      tone(660, 0.12, "triangle", 0.08, 1320);
      hint("Lantern " + lanterns.filter((l) => l.got).length + " of 7");
      pulls.splice(i, 1);
    }
  }
  if (pulls.length) {
    const p = pulls[0];
    showRope(player.x, gy + 1.15, player.z, p.lantern.mesh.position.x, p.lantern.mesh.position.y, p.lantern.mesh.position.z);
  } else if (lassoT > 0) {
    const u = 1 - lassoT / 0.55;
    const ang = heroYaw - 1.1 + u * 2.4;
    showRope(player.x, gy + 1.1, player.z, player.x + Math.sin(ang) * 1.7, gy + 1.35, player.z + Math.cos(ang) * 1.7);
  } else ropeBeads.forEach((b) => { b.visible = false; });
}

function showPanel(on) {
  panel.style.display = on ? "block" : "none";
  document.getElementById("overlay").style.display = on ? "flex" : "none";
}

function refreshPanel() {
  const optsOn = state === "title" || state === "pause" || state === "win" || state === "dead";
  opts.style.display = optsOn ? "flex" : "none";
  help.style.display = optsOn ? "block" : "none";
  document.getElementById("hud").style.display = state === "title" ? "none" : "block";
  topname.style.display = state === "title" ? "block" : "none";
  if (state === "title") {
    heading.textContent = "";
    blurb.textContent = "You are the Hero, lost in the woods. Collect 7 lanterns and reach the gate. The monster is friendly by day.";
    help.innerHTML = CONTROLS_HELP;
    prompt.textContent = controllerPrompt();
    drawOpts();
  } else if (state === "pause") {
    heading.textContent = "PAUSED";
    blurb.textContent = pausePage === "options" ? "Options" : "D-pad or stick. A chooses. B closes.";
    help.innerHTML = CONTROLS_HELP;
    prompt.textContent = "B closes this menu";
    drawOpts();
  } else if (state === "win") {
    heading.textContent = "YOU ESCAPED THE FOREST!";
    blurb.textContent = "All 7 lanterns lit the way. The Hero made it out.";
    prompt.textContent = controllerPrompt();
    menuRow = 0;
    drawOpts();
  } else if (state === "dead") {
    heading.textContent = "TRY AGAIN";
    blurb.textContent = "The night was too spooky. You have another chance.";
    prompt.textContent = controllerPrompt();
    menuRow = 0;
    drawOpts();
  }
}
const CONTROLS_HELP = "Left stick or D-pad moves. Right stick looks, and R3 recenters. A jumps. X hides, talks, or picks up. B or RB swings the lasso. LT or L3 sprints. Y is first person. Start pauses. Hold Select for the stick readout.";
function canQuitApp() { return !!(window.AnitaApp && window.AnitaApp.quit); }
function backToPicker() {
  if (window.__nativePad || canQuitApp()) {
    location.href = (/\/forest\//.test(location.pathname) ? "../" : "") + "launcher.html?native=1";
    return;
  }
  if (/\/forest\//.test(location.pathname)) location.href = "../index.html";
}
function resumeGame() { state = "play"; showPanel(false); }
function pauseActions() {
  const items = [
    ["Resume", resumeGame],
    ["Restart", () => { resumeGame(); startGame(); }],
    ["Options", () => { pausePage = "options"; menuRow = 0; drawOpts(); }],
    ["Back to game menu", backToPicker],
  ];
  if (canQuitApp()) items.push(["Quit app", () => window.AnitaApp.quit()]);
  return items;
}
function optionActions() {
  const order = ["low", "med", "high"];
  return [
    ["Stick sensitivity: " + stickSens.toUpperCase(), () => { stickSens = order[(order.indexOf(stickSens) + 1) % 3]; save(LS_SENS, stickSens); drawOpts(); }],
    ["Invert camera Y: " + (invertY ? "ON" : "OFF"), () => { invertY = !invertY; save(LS_INVERT, invertY ? "1" : "0"); drawOpts(); }],
    ["Invert camera X: " + (invertX ? "ON" : "OFF"), () => { invertX = !invertX; save(LS_INVERTX, invertX ? "1" : "0"); drawOpts(); }],
    ["Invert move X: " + (invertMoveX ? "ON" : "OFF"), () => { invertMoveX = !invertMoveX; save(LS_INVERT_MOVE_X, invertMoveX ? "1" : "0"); drawOpts(); }],
    ["Camera follow: " + (camFollow ? "ON" : "OFF"), () => { camFollow = !camFollow; save(LS_FOLLOW, camFollow ? "1" : "0"); drawOpts(); }],
    ["Graphics: " + gfxChoice.toUpperCase() + (gfxChoice === "auto" ? " (" + gfxTier().toUpperCase() + ")" : ""), () => {
      const order = ["auto", "low", "med", "high"];
      gfxChoice = order[(order.indexOf(gfxChoice) + 1) % order.length];
      save(LS_GFX, gfxChoice);
      applyGfx();
      drawOpts();
    }],
  ];
}
function controllerPrompt() {
  const pad = window.MenuInput && MenuInput.usingController();
  if (pad || window.__nativePad) return "Press A to start";
  return isTouch ? "Tap to start" : "Press ENTER or A";
}
function titleActions() {
  if (pausePage === "options") return optionActions();
  return [
    ["Jumpscares: " + (jumpscareMode === "mild" ? "MILD" : "SCARY"), () => { jumpscareMode = jumpscareMode === "mild" ? "scary" : "mild"; save(LS_SCARE, jumpscareMode); drawOpts(); }],
    ["Start at: " + (startAt === "night" ? "NIGHT" : "DAY"), () => { startAt = startAt === "night" ? "day" : "night"; save(LS_START, startAt); drawOpts(); }],
    ["START GAME", startGame],
    ["Options", () => { pausePage = "options"; menuRow = 0; drawOpts(); }],
  ];
}
function endActions() {
  const items = [
    ["Play again", startGame],
    ["Back to game menu", backToPicker],
  ];
  if (canQuitApp()) items.push(["Quit app", () => window.AnitaApp.quit()]);
  return items;
}
function drawOpts() {
  opts.innerHTML = "";
  const items = state === "pause"

panel.addEventListener("click", () => {

});

function menuItems() {
  if (state === "pause") return pausePage === "options" ? optionActions() : pauseActions();
  if (state === "win" || state === "dead") return endActions();
  return titleActions();
}
function driveMenu(ev) {
  ev = ev || { up: 0, down: 0, left: 0, right: 0, confirm: 0, cancel: 0, start: 0 };
  const items = menuItems();
  const count = items.length;
  if (!count) return;
  if (menuRow >= count) menuRow = 0;
  let dir = 0;
  if (ev.down || ev.right) dir = 1;
  else if (ev.up || ev.left) dir = -1;
  if (dir) { menuRow = (menuRow + dir + count) % count; drawOpts(); }
  if (ev.cancel) {
    if (pausePage === "options") {
      pausePage = "root";
      menuRow = state === "title" ? 3 : 2;
      drawOpts();
    } else if (state === "pause") resumeGame();
    return;
  }
  if (ev.start && (state === "title" || state === "win" || state === "dead")) { startGame(); return; }
  if (ev.start && state === "pause" && pausePage !== "options") { resumeGame(); return; }
  if (ev.confirm) items[menuRow][1]();
}

function updatePlay(dt) {
  playTime += dt;
  invuln = Math.max(0, invuln - dt);
  const hostile = nightFactor > 0.55;
  if (pressed.fp) fp = !fp;
  if (pressed.pause) { state = "pause"; pausePage = "main"; menuRow = 0; showPanel(true); refreshPanel(); return; }
  if (pressed.jump && player.hop <= 0 && !hiding) {
    player.hop = 0.72;
    tone(480, 0.07, "square", 0.04, 220);
  }
  if (pressed.act) interact();
  if (pressed.lasso) tryLasso();
  lassoCd = Math.max(0, lassoCd - dt);
  if (lassoT > 0) lassoT = Math.max(0, lassoT - dt);
  if (!hostile) { stunUsed = false; stunT = 0; }
  else stunT = Math.max(0, stunT - dt);
  if (!inBush(player.x, player.z)) hiding = false;
  const moveXSign = invertMoveX ? -1 : 1;
  let ix = (stickTarget.x * sensMul() + ((keys.right ? 1 : 0) - (keys.left ? 1 : 0))) * moveXSign;
  let iy = -stickTarget.y * sensMul() + ((keys.up ? 1 : 0) - (keys.down ? 1 : 0));
  let moveMag = Math.hypot(ix, iy);
  if (moveMag > 1) { ix /= moveMag; iy /= moveMag; moveMag = 1; }
  const moving = moveMag > 0.01;
  const sprinting = !!(keys.sprint && moving && stamina > 0.02 && !hiding);
  if (sprinting) stamina = Math.max(0, stamina - dt / 3.2);
  else stamina = Math.min(1, stamina + dt / 2.4);
  const speed = hiding ? 1.4 : (sprinting ? 8.1 : 4.5);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  // The camera looks along (sin yaw, cos yaw). three.js then puts screen-right
  // on (-cos yaw, sin yaw). The opposite pair points at the left side of the picture.
  const rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
  let targetX = 0, targetZ = 0;
  if (moving) {
    const nx = ix / moveMag, ny = iy / moveMag;
    targetX = (fx * ny + rx * nx) * speed * moveMag;
    targetZ = (fz * ny + rz * nx) * speed * moveMag;
    heroYaw = dampAngle(heroYaw, Math.atan2(targetX, targetZ), dt, 10);
    walkT += dt * (sprinting ? 14 : 9) * (0.45 + moveMag);
    stepT -= dt;
    if (stepT <= 0) { noiseBurst(0.05, 0.04, 180); stepT = sprinting ? 0.22 : 0.38; }
  }
  const speeding = Math.hypot(targetX, targetZ) >= Math.hypot(vel.x, vel.z);
  const vk = 1 - Math.exp(-dt / (speeding ? 0.1 : 0.08));
  vel.x += (targetX - vel.x) * vk;
  vel.z += (targetZ - vel.z) * vk;
  player.x += vel.x * dt;
  player.z += vel.z * dt;
  pushOut(player);
  if (player.hop > 0) player.hop = Math.max(0, player.hop - dt * 1.6);
  const gy = groundY(player.x, player.z);
  hero.position.set(player.x, gy + player.hop - (hiding ? 0.62 : 0), player.z);
  hero.visible = !fp;
  hero.rotation.y = heroYaw;
  poseHero(dt, moving, hostile);

  const md = Math.hypot(mon.x - player.x, mon.z - player.z);
  const sees = hostile && !hiding && md < 14 && los(mon.x, mon.z, player.x, player.z);
  if (sees) mon.mode = "chase";
  else if (mon.mode === "chase" && (hiding || md > 18)) mon.mode = "wander";
  if (mon.mode === "chase" && !wasChasing) { player.hop = 0.55; spotT = 1.3; tone(740, 0.08, "square", 0.05, 420); }
  wasChasing = mon.mode === "chase";
  spotT = Math.max(0, spotT - dt);
  if (hostile && mon.mode === "wander" && surprises < 2 && playTime > 48 && playTime - lastSurprise > 120) {
    if (Math.random() < dt * 0.025) triggerSurprise();
  }
  let mxv = 0, mzv = 0;
  if (mon.mode === "flee") {
    mon.flee -= dt;
    mxv = mon.x - player.x; mzv = mon.z - player.z;
    if (mon.flee <= 0) mon.mode = "wander";
  } else if (mon.mode === "chase" && !hiding) {
    mxv = player.x - mon.x; mzv = player.z - mon.z;
  } else {
    if (dist2(mon.x, mon.z, mon.tx, mon.tz) < 4) {
      mon.tx = pathX(8 + rand() * 90) + (rand() - 0.5) * 10;
      mon.tz = 8 + rand() * 90;
    }
    mxv = mon.tx - mon.x; mzv = mon.tz - mon.z;
  }
  const mlen = Math.hypot(mxv, mzv) || 1;
  let mspeed = mon.mode === "chase" ? 6.0 : (mon.mode === "flee" ? 7.2 : 2.3);
  if (stunT > 0) mspeed = 0;
  if (state === "play") {
    mon.x += (mxv / mlen) * mspeed * dt;
    mon.z += (mzv / mlen) * mspeed * dt;
    mon.yaw = Math.atan2(mxv, mzv);
    monsterWalk += dt * (mon.mode === "wander" ? 4 : 10);
  }
  pushOut(mon);
  mon.wave = !hostile && md < 6 ? 1 : 0;
  if (talkT > 0 && !hostile) mon.yaw = Math.atan2(player.x - mon.x, player.z - mon.z);
  poseMonster(dt, mlen > 0.2, hostile);
  if (!hostile && md < 3.6) { /* ready to talk */ }
  if (stunT <= 0 && hostile && !hiding && invuln <= 0 && md < 1.55 && mon.mode === "chase") beginScare("catch");

  talkT = Math.max(0, talkT - dt);
  hintT = Math.max(0, hintT - dt);
  bubble.visible = false;
  bang.visible = spotT > 0 && state === "play" && !fp;
  if (bang.visible) bang.position.set(player.x, gy + 2.55 + player.hop, player.z);
  const near = nearestLantern();
  arrow.visible = !!near && hintT > 0;
  if (near && arrow.visible) {
    const ay = Math.atan2(near.x - player.x, near.z - player.z);
    arrow.position.set(player.x, gy + 2.5, player.z);
    arrow.rotation.y = ay;
    arrow.rotation.x = Math.PI / 2.4;
  }
  collected = lanterns.filter((l) => l.got).length;
  if (collected >= 7) gateOpen = true;
  door.rotation.y += ((gateOpen ? -1.35 : 0) - door.rotation.y) * Math.min(1, dt * 3);
  if (gateOpen && dist2(player.x, player.z, gateSpot.x, gateSpot.z) < 6) {
    state = "win";
    tone(523, 0.15, "triangle", 0.08);
    setTimeout(() => tone(659, 0.15, "triangle", 0.08), 120);
    setTimeout(() => tone(784, 0.25, "triangle", 0.08), 240);
    showPanel(true); refreshPanel();
  }
  updatePulls(dt, gy);
  lanterns.forEach((l) => {
    if (l.got || pulls.some((p) => p.lantern === l)) return;
    l.mesh.position.y = l.baseY + Math.sin(performance.now() / 380 + l.x) * 0.12;
    l.mesh.rotation.y += dt;
  });
  butterflies.forEach((b, i) => {
    b.position.x += Math.sin(performance.now() / 600 + i) * dt * 0.8;
    b.position.y = 1.2 + Math.sin(performance.now() / 300 + i) * 0.4;
    b.rotation.y += dt * 4;
  });
  const fpArr = fireflies.geometry.attributes.position.array;
  for (let i = 0; i < 36; i++) {
    fpArr[i * 3] += Math.sin(performance.now() / 700 + i) * dt * 0.4;
    fpArr[i * 3 + 1] = 0.8 + Math.sin(performance.now() / 400 + i) * 0.5;
  }
  fireflies.geometry.attributes.position.needsUpdate = true;

  ambT -= dt;
  if (ambT <= 0) {
    if (hostile) tone(320 + Math.random() * 80, 0.35, "sine", 0.03, 180);
    else tone(1400 + Math.random() * 600, 0.09, "sine", 0.03, 2200);
    ambT = hostile ? 7 + Math.random() * 6 : 3 + Math.random() * 4;
  }
  if (scaredExpression(hostile, md)) {

    if (breathT <= 0) { noiseBurst(0.12, 0.05, 500); breathT = 0.55; }
  }
  if (hostile && md < 16) {
    heartT -= dt;
    const rate = lerp(0.7, 0.22, 1 - clamp(md / 16, 0, 1));
    if (heartT <= 0) { tone(70, 0.12, "sine", lerp(0.02, 0.1, 1 - md / 16)); heartT = rate; }

}

function scaredExpression(hostile, md) {
  return hostile && (expression === "scared" || expression === "terrified" || md < 15);
}

function canopyRadiusAt(c, wy) {
  const dy = wy - c.y;
  if (c.kind === "cone") {
    if (dy < -c.ry || dy > c.ry) return 0;
    return c.rx * (1 - (dy + c.ry) / (c.ry * 2));
  }
  if (Math.abs(dy) > c.ry) return 0;
  return c.rx * Math.sqrt(Math.max(0, 1 - (dy / c.ry) * (dy / c.ry)));
}

const _fadeDummy = new THREE.Object3D();
function updateCanopyFade(dt) {
  const touched = new Set();
  for (const c of canopies) {
    const goal = c.want || 0;
    const next = c.fade + (goal - c.fade) * Math.min(1, dt * 14);
    if (Math.abs(next - c.fade) < 0.004 && next < 0.01 && goal === 0) {
      if (c.fade !== 0) {
        c.fade = 0;
        _fadeDummy.position.set(c.x, c.y, c.z);
        _fadeDummy.scale.set(c.sx, c.sy, c.sz);
        _fadeDummy.rotation.set(0, 0, 0);
        _fadeDummy.updateMatrix();
        c.mesh.setMatrixAt(c.index, _fadeDummy.matrix);
        touched.add(c.mesh);
      }
      continue;
    }
    c.fade = next;
    const s = Math.max(0.02, 1 - c.fade);
    _fadeDummy.position.set(c.x, c.y, c.z);
    _fadeDummy.scale.set(c.sx * s, c.sy * s, c.sz * s);
    _fadeDummy.rotation.set(0, 0, 0);
    _fadeDummy.updateMatrix();
    c.mesh.setMatrixAt(c.index, _fadeDummy.matrix);
    touched.add(c.mesh);
  }
  touched.forEach((m) => { m.instanceMatrix.needsUpdate = true; });
}

function resolveCamera(camX, camY, camZ, lookX, lookY, lookZ) {
  let x = camX, y = camY, z = camZ;
  for (const c of canopies) c.want = 0;
  for (let pass = 0; pass < 4; pass++) {
    const dx = x - lookX, dy = y - lookY, dz = z - lookZ;
    const len = Math.hypot(dx, dy, dz) || 0.001;
    const ux = dx / len, uy = dy / len, uz = dz / len;
    let pull = len;
    for (const c of canopies) {
      const along = (c.x - lookX) * ux + (c.y - lookY) * uy + (c.z - lookZ) * uz;
      if (along > 0.25 && along < len + c.rx) {
        const py = lookY + uy * along;
        const rad = canopyRadiusAt(c, py) + 0.75;
        const px = lookX + ux * along, pz = lookZ + uz * along;
        const perp = Math.hypot(c.x - px, c.z - pz);
        if (rad > 0.8 && perp < rad && Math.abs(c.y - py) < c.ry + 0.6) {
          pull = Math.min(pull, Math.max(1.3, along - rad - 0.2));
        }
      }
      const radCam = canopyRadiusAt(c, y);
      const dCam = Math.hypot(c.x - x, c.z - z);
      if (radCam > 0.15 && dCam < radCam + 0.9) {
        pull = Math.min(pull, Math.max(1.3, len - (radCam + 0.9 - dCam) - 0.15));
      }
    }
    if (pull > len - 0.04) break;
    x = lookX + ux * pull;
    y = lookY + uy * pull;
    z = lookZ + uz * pull;
  }
  for (const c of canopies) {
    const rad = canopyRadiusAt(c, y);
    if (rad > 0.15 && Math.hypot(c.x - x, c.z - z) < rad + 0.45 && Math.abs(c.y - y) < c.ry + 0.3) c.want = 1;
  }
  return { x, y, z };
}

function aimCamera(camX, camY, camZ, lookX, lookY, lookZ) {
  const p = resolveCamera(camX, camY, camZ, lookX, lookY, lookZ);
  camera.position.set(p.x, p.y, p.z);
  camera.lookAt(lookX, lookY, lookZ);
}

function placeCamera(hostile, md) {
  const scaredNow = hostile && (md < 15 || mon.mode === "chase" || expression === "scared");
  const gy = groundY(player.x, player.z);
  if (fp && state === "play") {
    for (const c of canopies) c.want = 0;
    camera.position.set(player.x, gy + 1.6, player.z);
    const fx = Math.sin(cameraYaw), fz = Math.cos(cameraYaw);
    camera.lookAt(player.x + fx * 4, gy + 1.55 + cameraPitch * 1.4, player.z + fz * 4);
    return;
  }
  if (scaredNow && state === "play") {
    const mx = mon.x - player.x, mz = mon.z - player.z;
    const len = Math.hypot(mx, mz) || 1;
    const sx = -mz / len, sz = mx / len;
    const midX = (player.x + mon.x) * 0.5, midZ = (player.z + mon.z) * 0.5;
    aimCamera(midX + sx * 3.7, gy + 1.7, midZ + sz * 3.7, midX, gy + 1.55, midZ);
    const face = (obj, x, z) => { obj.rotation.y = Math.atan2(camera.position.x - x, camera.position.z - z); };
    face(hero, player.x, player.z);
    face(monster, mon.x, mon.z);
    return;
  }
  const ang = cameraYaw + Math.PI;
  const dist = hiding ? 4.2 : 5.4;
  const fx = Math.sin(ang), fz = Math.cos(ang);
  aimCamera(player.x + fx * dist, gy + 1.95 - cameraPitch * 0.85, player.z + fz * dist, player.x, gy + 1.25 + cameraPitch * 1.15, player.z);
}

let scareCamReady = false;
const scareBase = new THREE.Vector3();
function updateScare(dt) {

  }

  monster.userData.faces.night.visible = true;

  monster.userData.hands.soft.forEach((h) => { h.visible = false; });
  vignette.style.opacity = "0";
  scene.fog.density = 0.006;
  amb.intensity = 0.7;
  sun.intensity = 0.35;
  camera.position.set(
    scareBase.x + Math.sin(scareT * 78) * 0.05 * shiver,

  );

  camera.updateMatrixWorld(true);
  scareHead.getWorldPosition(_camV);

function placeSpeech() {
  const el = document.getElementById("speech");
  if (talkT <= 0 || nightFactor > 0.55 || state !== "play") { el.style.display = "none"; return; }
  el.textContent = talkLine;
  el.style.display = "block";
  camera.updateMatrixWorld();
  const v = new THREE.Vector3(mon.x, groundY(mon.x, mon.z) + 2.95, mon.z);
  v.project(camera);
  const w = view.clientWidth || innerWidth, h = view.clientHeight || innerHeight;
  let x = w * 0.5, y = 110;
  if (v.z <= 1) {
    x = (v.x * 0.5 + 0.5) * w;
    y = (-v.y * 0.5 + 0.5) * h;
  }
  el.style.left = x + "px";
  el.style.top = y + "px";
  const r = el.getBoundingClientRect();
  let dx = 0, dy = 0;
  if (r.left < 8) dx = 8 - r.left;
  if (r.right > w - 8) dx = (w - 8) - r.right;
  if (r.top < 8) dy = 8 - r.top;
  if (r.bottom > h - 8) dy = (h - 8) - r.bottom;
  el.style.left = (x + dx) + "px";
  el.style.top = (y + dy) + "px";
}
function fmt(s) {

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000) || 0.016;
  last = now;
  pollPad();
  const menuEv = window.MenuInput ? MenuInput.poll() : null;
  if (pressed.mute) muted = !muted;
  if (pressed.hidetoggle) toggleButtons();
  if (!window.__nativePad && padConnected && manualHide === null) { /* auto hide via buttonsHidden */ }
  applySky();
  if (state === "title") {
    layoutTitle();
    driveMenu(menuEv);
    topname.style.display = "block";
  } else if (state === "play") {
    cycleT += dt;
    updatePlay(dt);
  } else if (state === "scare") {
    updateScare(dt);
  } else if (state === "pause") {
    driveMenu(menuEv);
    if (pressed.pause) { state = "play"; showPanel(false); }
    placeCamera(nightFactor > 0.55, Math.hypot(mon.x - player.x, mon.z - player.z));
  } else if (state === "win" || state === "dead") {
    driveMenu(menuEv);
  }
  refreshHud();
  placeSpeech();
  updateCanopyFade(dt);
  if (state !== "play") bang.visible = false;
  paintPadDebug();
  topname.style.display = state === "title" ? "block" : "none";
  for (const k in pressed) delete pressed[k];
  renderer.render(scene, camera);
  fpsAcc += dt; fpsFrames++;
  if (grassMat.userData.shader) grassMat.userData.shader.uniforms.uTime.value = now / 1000;
  if (fpsAcc >= 0.5) {
    fps = fpsFrames / fpsAcc; fpsFrames = 0; fpsAcc = 0;
    const cap = gfxProfile().pixel;
    const next = fps < 30 ? Math.max(0.45, resScale * 0.85) : (fps > 55 ? Math.min(cap, resScale * 1.08) : resScale);
    if (Math.abs(next - resScale) > 0.02) {
      resScale = next;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, resScale));
      resize();
    }
  }
  requestAnimationFrame(frame);
}

  get scareHeadOn() { return scareHead.visible; },
  get cameraYaw() { return cameraYaw; },
  set cameraYaw(v) { camYaw = v; cameraYaw = v; },
  get cameraPitch() { return camPitch; },
  set cameraPitch(v) { camPitch = v; cameraPitch = v; },
  get orbitYaw() { return camYaw - heroYaw; },
  get lassoT() { return lassoT; },
  get stunT() { return stunT; },
  get stickMag() { return Math.hypot(stickTarget.x, stickTarget.y); },
  get padDebugOn() { return debugOn; },
  togglePadDebug() { debugOn = !debugOn; },
  cameraPos() { return { x: camera.position.x, y: camera.position.y, z: camera.position.z }; },
  captureView() {
    camera.updateMatrixWorld(true);
    _viewProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  },
  projectFrozen(x, y, z) {
    _projV.set(x, y, z).applyMatrix4(_viewProj);
    return { x: _projV.x, y: _projV.y, z: _projV.z };
  },
  project(x, y, z) {
    camera.updateMatrixWorld(true);
    _projV.set(x, y, z).project(camera);
    return {
      x: (_projV.x * 0.5 + 0.5) * innerWidth,
      y: (-_projV.y * 0.5 + 0.5) * innerHeight,
    };
  },
  heroParts() {
    hero.updateWorldMatrix(true, true);
    const head = hero.getObjectByName("head");
    const p = new THREE.Vector3();
    head.getWorldPosition(p);
    const tiara = hero.getObjectByName("tiara");
    const tp = new THREE.Vector3();
    if (tiara) tiara.getWorldPosition(tp);
    return {
      hx: p.x, hy: p.y, hz: p.z,
      px: hero.position.x, py: hero.position.y, pz: hero.position.z,
      rx: hero.rotation.x, rz: hero.rotation.z,
      tx: tp.x, ty: tp.y, tz: tp.z,
    };
  },
  player,
  monster: mon,
  lanterns,
  bushes: BUSHES,
  canopies,
  gate: gateSpot,
  setPhase(name) {
    if (name === "day") cycleT = 4;
    else if (name === "dusk") cycleT = DAY + 6;
    else if (name === "night") cycleT = DAY + DUSK + 4;
    else if (name === "dawn") cycleT = DAY + DUSK + NIGHT + 4;
    applySky();
  },
  interact,
  forceSurprise: triggerSurprise,
  forcePause() { if (state === "play" || state === "scare") { state = "pause"; pausePage = "main"; menuRow = 0; showPanel(true); refreshPanel(); } },
};
function applyGfx() {
  const p = gfxProfile();
  renderer.toneMapping = gfxTier() === "high" ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  resScale = p.pixel;
  renderer.shadowMap.enabled = p.shadow > 0;
  sun.castShadow = p.shadow > 0;
  if (p.shadow) sun.shadow.mapSize.set(p.shadow, p.shadow);
  grassMesh.count = p.grass;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, resScale));
  resize();
}
let texturesReady = false;
// Ground037, Bark012 and Rock035 are CC0 textures from ambientCG, resized for the TV.
function bootTextures() {
  const loader = new THREE.TextureLoader();
  const jobs = [
    ["tex/ground_color.jpg", THREE.SRGBColorSpace, (t) => { t.repeat.set(16, 20); groundMat.map = t; groundMat.needsUpdate = true; }],
    ["tex/ground_normal.jpg", THREE.LinearSRGBColorSpace, (t) => { if (!groundMat.isMeshStandardMaterial) return; t.repeat.set(16, 20); groundMat.normalMap = t; groundMat.needsUpdate = true; }],
    ["tex/ground_rough.jpg", THREE.LinearSRGBColorSpace, (t) => { if (!groundMat.isMeshStandardMaterial) return; t.repeat.set(16, 20); groundMat.roughnessMap = t; groundMat.needsUpdate = true; }],
    ["tex/bark_color.jpg", THREE.SRGBColorSpace, (t) => { t.repeat.set(1, 2); trunkMat.map = t; trunkMat.needsUpdate = true; }],
    ["tex/bark_normal.jpg", THREE.LinearSRGBColorSpace, (t) => { if (!trunkMat.isMeshStandardMaterial) return; t.repeat.set(1, 2); trunkMat.normalMap = t; trunkMat.needsUpdate = true; }],
    ["tex/rock_color.jpg", THREE.SRGBColorSpace, (t) => { rockMesh.material.map = t; rockMesh.material.needsUpdate = true; }],
    ["tex/rock_rough.jpg", THREE.LinearSRGBColorSpace, (t) => { if (!rockMesh.material.isMeshStandardMaterial) return; rockMesh.material.roughnessMap = t; rockMesh.material.needsUpdate = true; }],
  ];
  let left = jobs.length;
  const finish = () => {
    left -= 1;
    if (left > 0) return;
    texturesReady = true;
    const bar = document.getElementById("loadbar");
    if (bar) bar.style.display = "none";
  };
  for (const [url, space, applyMap] of jobs) {
    loader.load(url, (t) => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = space;
      t.anisotropy = 4;
      applyMap(t);
      finish();
    }, undefined, finish);
  }
}
refreshPanel();
applyChrome();
resize();
requestAnimationFrame(() => {
  const bar = document.getElementById("loadbar");
  if (bar) bar.style.display = "none";
  frame(performance.now());
});
setTimeout(bootTextures, 3500);
let modelsReady = false;
function mountCharacter(root, gltf) {
  while (root.children.length) root.remove(root.children[0]);
  const model = gltf.scene;
  root.add(model);
  model.traverse((obj) => {
    if (!obj.isMesh) return;
    obj.castShadow = gfxTier() === "high";
    obj.receiveShadow = true;
  });
  const mixer = new THREE.AnimationMixer(model);
  const map = {};
  for (const clip of gltf.animations) {
    const action = mixer.clipAction(clip);
    map[clip.name] = action;
  }
  root.userData.mixer = mixer;
  root.userData.clips = { map, current: "" };
  const lasso = root.getObjectByName("lasso");
  if (lasso) {
    root.userData.lasso = lasso;
    const light = new THREE.PointLight(0xffc85a, 0.6, 5);
    light.name = "lassoLight";
    lasso.add(light);
  }
}
function instanceGltf(gltf, spots, scaleMul) {
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((src) => {
    if (!src.isMesh) return;
    const geo = src.geometry.clone();
    geo.applyMatrix4(src.matrixWorld);
    const mat = src.material;
    if (mat) {
      mat.side = THREE.DoubleSide;
      const label = (mat.name || "") + " " + (src.name || "");
      if (/leaf/i.test(label)) {
        mat.color.set(0x2f6a30);
        mat.alphaTest = 0.35;
        mat.transparent = false;
      } else if (mat.color) {
        mat.color.set(0x6b4a32);
      }
    }
    const inst = new THREE.InstancedMesh(geo, mat, spots.length);
    const d = new THREE.Object3D();
    spots.forEach((p, i) => {
      d.position.set(p.x, groundY(p.x, p.z), p.z);
      d.rotation.y = (i * 1.3) % 6.2;
      d.scale.setScalar((p.s || 1) * scaleMul);
      d.updateMatrix();
      inst.setMatrixAt(i, d.matrix);
    });
    scene.add(inst);
  });
}
function loadForestModels() {
  const loader = new GLTFLoader();
  let left = 6;
  const done = () => { left -= 1; if (left <= 0) modelsReady = true; };
  const load = (url, ok) => loader.load(url, (g) => { ok(g); done(); }, undefined, done);
  load("models/hero.glb", (g) => mountCharacter(hero, g));
  load("models/monster.glb", (g) => {
    mountCharacter(monster, g);
    monster.userData.faces = {
      day: monster.getObjectByName("faceDay") || { visible: true },
      night: monster.getObjectByName("faceNight") || { visible: false },
    };
    monster.userData.hands = monster.userData.hands || { soft: [], claw: [] };
  });
  load("models/tree_pine.glb", (g) => {
    instanceGltf(g, pines, 1.8);
    instanceGltf(g, far, 1.6);
    const old = scene.getObjectByName("pine-canopy");
    if (old) old.visible = false;
    const trunksOld = scene.getObjectByName("pine-trunks");
    if (trunksOld) trunksOld.visible = false;
  });
  load("models/tree_oak.glb", (g) => {
    instanceGltf(g, oaks, 1.7);
    const old = scene.getObjectByName("oak-canopy");
    if (old) old.visible = false;
    const trunksOld = scene.getObjectByName("oak-trunks");
    if (trunksOld) trunksOld.visible = false;
  });
  load("models/tree_broad.glb", (g) => instanceGltf(g, oaks.filter((_, i) => i % 2 === 0), 1.5));
  load("models/rock.glb", (g) => {
    instanceGltf(g, ROCKS.map((r) => ({ x: r.x, z: r.z, s: 2.2 })), 1);
    const old = scene.getObjectByName("rock-standins");
    if (old) old.visible = false;
  });
  const cards = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(2.4, 1.6),
    new THREE.MeshLambertMaterial({ color: 0x2d6a32, side: THREE.DoubleSide }),
    (pines.length + oaks.length + 80) * 3
  );
  const far = [];
  for (let i = 0; i < 80; i++) {
    const ang = (i / 80) * Math.PI * 2;
    const rad = 34 + (i % 4) * 4;
    const x = Math.cos(ang) * rad;
    const z = 42 + Math.sin(ang) * rad * 0.85;
    if (pathDist(x, z) < 6) continue;
    far.push({ x, z, s: 1.3 + (i % 3) * 0.25 });
  }
  function crown(spots, height) {
    const d = new THREE.Object3D();
    spots.forEach((p, i) => {
      const y = groundY(p.x, p.z) + height * (p.s || 1);
      for (let k = 0; k < 3; k++) {
        d.position.set(p.x + (k - 1) * 0.3, y, p.z);
        d.rotation.set(0.15, i * 0.7 + k * 1.05, 0);
        d.scale.setScalar(1.1 * (p.s || 1));
        d.updateMatrix();
        cards.setMatrixAt(cards.count, d.matrix);
        cards.count += 1;
      }
    });
  }
  cards.count = 0;
  crown(pines, 7.2);
  crown(oaks, 5.4);
  crown(far, 8);
  cards.instanceMatrix.needsUpdate = true;
  scene.add(cards);
  const logGeo = new THREE.CylinderGeometry(0.16, 0.2, 1.8, 6);
  logGeo.rotateZ(Math.PI / 2);
  const logMesh = new THREE.InstancedMesh(logGeo, lambert(0x5c4030), 6);
  const logSpots = [{ x: 5.2, z: 24 }, { x: -6.4, z: 41 }, { x: 7.1, z: 63 }, { x: -4.8, z: 78 }, { x: 9, z: 52 }, { x: -8.2, z: 18 }];
  const ld = new THREE.Object3D();
  logSpots.forEach((p, i) => {
    ld.position.set(p.x, groundY(p.x, p.z) + 0.18, p.z);
    ld.rotation.y = i * 0.8;
    ld.updateMatrix();
    logMesh.setMatrixAt(i, ld.matrix);
  });
  logMesh.instanceMatrix.needsUpdate = true;
  scene.add(logMesh);
}
loadForestModels();
window.addEventListener("error", (e) => {
  const n = document.getElementById("boot-error");
  n.style.display = "flex";
  n.textContent = String((e && e.message) || e);
});
</script>
