<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05071c">
<meta name="screen-orientation" content="landscape">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<title>DON'T DIE</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#05071c;overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0}
  #game{position:fixed;inset:0}
</style>
</head>
<body>
<div id="game"></div>
<script>
function DONTDIE(root, SPR, opts){
"use strict";
opts = opts || {};
const IMG = {};
for (const k in SPR) { const i = new Image(); i.src = SPR[k]; IMG[k] = i; }
const W = 960, H = 540, GROUND = 460, LEVEL_W = 6400, GATE_X = 5000;
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const LISTENERS = [];
function on(t, ty, fn, o){ t.addEventListener(ty, fn, o); LISTENERS.push([t, ty, fn, o]); }

// ---------- DOM setup ----------
if (getComputedStyle(root).position === 'static') root.style.position = 'relative';
Object.assign(root.style, { overflow:'hidden', touchAction:'none', userSelect:'none', webkitUserSelect:'none', webkitTouchCallout:'none', webkitTapHighlightColor:'transparent', background:'#05071c' });
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
Object.assign(cv.style, { position:'absolute', display:'block', background:'#0a0f3a', borderRadius:'8px', boxShadow:'0 0 40px #6a2cff66', touchAction:'none' });
root.appendChild(cv);
const ctx = cv.getContext('2d');

const touchLayer = document.createElement('div');
Object.assign(touchLayer.style, { position:'absolute', inset:'0', pointerEvents:'none', display: isTouch ? 'block' : 'none', zIndex:'2' });
root.appendChild(touchLayer);
const BTN_DEFS = [
  {k:'left',  label:'\u25C0', side:'L', col:0, row:0, wide:1.15},
  {k:'right', label:'\u25B6', side:'L', col:1, row:0, wide:1.15},
  {k:'jump',  label:'JUMP',   side:'R', col:0, row:0, wide:1.1},
  {k:'laser', label:'ZAP<br><small>Z</small>', side:'R', col:1, row:0},
  {k:'fly',   label:'FLY',    side:'R', col:0, row:1},
  {k:'talk',  label:'TALK<br><small>X</small>', side:'R', col:1, row:1},
  {k:'pause', label:'II',     side:'T', col:0},
  {k:'mute',  label:'\u266B', side:'T', col:1}
];
const BTN = {};
for (const d of BTN_DEFS){
  const b = document.createElement('div'); b.dataset.k = d.k; b.innerHTML = '<span style="pointer-events:none">' + d.label + '</span>';
  Object.assign(b.style, { position:'absolute', pointerEvents:'auto', borderRadius:'50%', background:'rgba(255,255,255,0.16)', border:'3px solid rgba(255,255,255,0.55)',
    color:'#fff', fontFamily:'Arial, sans-serif', fontWeight:'bold', display:'flex', alignItems:'center', justifyContent:'center', textAlign:'center', lineHeight:'1.05',
    textShadow:'0 2px 3px #000', boxSizing:'border-box', touchAction:'none', userSelect:'none', webkitUserSelect:'none', webkitTouchCallout:'none' });
  touchLayer.appendChild(b); BTN[d.k] = {el:b, d};
}
const portrait = document.createElement('div');
portrait.innerHTML = '<div style="font-size:64px;margin-bottom:12px">\uD83D\uDCF1\u21BB</div><div>Please turn your phone sideways</div><div style="font-size:16px;opacity:.8;margin-top:10px">DON\'T DIE plays in landscape</div>';
Object.assign(portrait.style, { position:'absolute', inset:'0', zIndex:'5', display:'none', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center',
  background:'radial-gradient(circle at 50% 40%, #2a2a8a, #05071c)', color:'#ffe35a', font:'bold 24px Arial, sans-serif', padding:'20px', boxSizing:'border-box' });
root.appendChild(portrait);

function fit(){
  const rw = root.clientWidth, rh = root.clientHeight; if (!rw || !rh) return;
  const s = Math.min(rw/W, rh/H);
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px'; cv.style.left = ((rw - W*s)/2)+'px'; cv.style.top = ((rh - H*s)/2)+'px';
  // if something outside the game (e.g. a hosting site's badge) sits over the bottom-right corner, lift the right buttons above it
  let avoidR = 0;
  try { const rr = root.getBoundingClientRect();
    for (const pt of [[rr.right-40, rr.bottom-20], [rr.right-140, rr.bottom-20]]){
      const els = document.elementsFromPoint ? document.elementsFromPoint(pt[0], pt[1]) : [];
      for (const el of els){ if (el === document.documentElement || el === document.body || root.contains(el)) continue;
        const r = el.getBoundingClientRect(); if (r.height > 0 && r.height < rr.height*0.4) avoidR = Math.max(avoidR, rr.bottom - r.top + 6); }
    } } catch(e){}
  const bs = Math.round(Math.max(58, Math.min(120, Math.min(rw, rh) * 0.2))), g = Math.round(bs * 0.14);
  for (const k in BTN){ const {el, d} = BTN[k]; const w = Math.round((d.side === 'T' ? bs*0.62 : bs) * (d.wide || 1));
    el.style.width = w+'px'; el.style.height = w+'px'; el.style.fontSize = Math.round(w*(d.k==='left'||d.k==='right'?0.38:0.22))+'px';
    el.style.left = el.style.right = el.style.top = el.style.bottom = '';
    if (d.side === 'L'){ el.style.left = (g + d.col*(bs*1.15+g))+'px'; el.style.bottom = (g + 4)+'px'; }
    else if (d.side === 'R'){ el.style.right = (g + d.col*(bs*1.1+g))+'px'; el.style.bottom = (g + 4 + avoidR + d.row*(bs*1.1+g))+'px'; }
    else { el.style.right = (g + d.col*(w+g))+'px'; el.style.top = g+'px'; }
  }
  portrait.style.display = (isTouch && rh > rw * 1.05) ? 'flex' : 'none';
}
on(window, 'resize', fit); on(window, 'orientationchange', () => setTimeout(fit, 200));
if (window.ResizeObserver){ const ro = new ResizeObserver(fit); ro.observe(root); LISTENERS.push([{removeEventListener(){ ro.disconnect(); }}, 'x', null]); }
fit();

// ---------- sound (simple WebAudio beeps) ----------
let AC = null, muted = false;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    const buf = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = buf; src.connect(AC.destination); src.start(0); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}

function beep(f, d=0.12, type='square', v=0.08, f2=null){
  if(!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}
const SFX = {
  jump:()=>beep(380,0.15,'square',0.06,760),
  laser:()=>beep(1200,0.12,'sawtooth',0.05,300),
  stomp:()=>{beep(220,0.1,'square',0.08,90);},
  pop:()=>{beep(660,0.08,'triangle',0.1,1320);},
  diamond:()=>{beep(880,0.08,'triangle',0.1);setTimeout(()=>beep(1320,0.15,'triangle',0.1),80);},
  hurt:()=>beep(300,0.3,'sawtooth',0.08,80),
  talk:()=>beep(520,0.06,'triangle',0.08,620),
  boing:()=>beep(200,0.2,'sine',0.12,500),
  gate:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.1),i*110));},
  win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.1),i*140));},
  die:()=>{[400,300,200,120].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'square',0.08),i*180));},
  heart:()=>{beep(700,0.1,'sine',0.12,1000);}
};

// ---------- input ----------
const keys = {}; const pressed = {};
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump',
  KeyF:'fly', ShiftLeft:'fly', ShiftRight:'fly', KeyZ:'laser', KeyJ:'laser', KeyX:'talk', Enter:'enter', NumpadEnter:'enter', KeyM:'mute', KeyP:'pause' };
function press(k){ if(!keys[k]) pressed[k] = true; keys[k] = true; }
function release(k){ keys[k] = false; }
function tapEnter(){ press('enter'); setTimeout(() => release('enter'), 60); }
on(window, 'keydown', e => { audio(); const k = KEYMAP[e.code]; if(k){ e.preventDefault(); press(k); } });
on(window, 'keyup', e => { const k = KEYMAP[e.code]; if(k){ e.preventDefault(); release(k); } });

let gestured = false;
function firstGesture(){
  audio();
  if (gestured) return; gestured = true;
  if (opts.fullscreen && isTouch){
    try {
      const de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rq && !document.fullscreenElement){
        const p = rq.call(de, {navigationUI:'hide'});
        const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e){} };
        if (p && p.then) p.then(lock).catch(()=>{}); else lock();
      }
    } catch(e){}
  }
}
// multi-touch: every frame of touch activity, recompute which buttons are under any finger
const touchHeld = {};
function btnAt(x, y){ const el = document.elementFromPoint(x, y); const b = el && el.closest ? el.closest('[data-k]') : null; return (b && touchLayer.contains(b)) ? b.dataset.k : null; }
function onTouch(e){
  if (e.cancelable) e.preventDefault();
  firstGesture();
  const active = new Set();
  for (const t of e.touches){ const k = btnAt(t.clientX, t.clientY); if (k) active.add(k); }
  let tapOutside = false;
  if (e.type === 'touchstart') for (const t of e.changedTouches) if (!btnAt(t.clientX, t.clientY)) tapOutside = true;
  for (const k in BTN){
    const isOn = active.has(k);
    if (isOn && !touchHeld[k]) press(k);
    if (!isOn && touchHeld[k]) release(k);
    touchHeld[k] = isOn;
    BTN[k].el.style.background = isOn ? 'rgba(255,79,165,0.55)' : 'rgba(255,255,255,0.16)';
    BTN[k].el.style.transform = isOn ? 'scale(0.93)' : '';
  }
  if (e.type === 'touchstart'){
    if (state !== 'play' && state !== 'dying' && (tapOutside || active.size)) tapEnter();
    else if (state === 'play' && paused && tapOutside) press('pause');
  }
}
for (const ty of ['touchstart','touchmove','touchend','touchcancel']) on(root, ty, onTouch, {passive:false});
on(root, 'contextmenu', e => e.preventDefault());
on(root, 'dblclick', e => e.preventDefault());
on(document, 'gesturestart', e => e.preventDefault());
on(cv, 'mousedown', () => { audio(); if (state !== 'play' && state !== 'dying') tapEnter(); });

// ---------- helpers ----------
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
function drawSprite(img, cx, bottom, h, flip=false, alpha=1, rot=0, sx=1, sy=1){
  if(!img.complete || !img.naturalWidth) return;
  const w = img.naturalWidth * h / img.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, bottom); ctx.rotate(rot); ctx.scale((flip?-1:1)*sx, sy);
  ctx.drawImage(img, -w/2, -h, w, h); ctx.restore();
}
function heartPath(x,y,s){ ctx.beginPath(); ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x, y, x-s*0.5, y, x-s*0.5, y+s*0.3); ctx.bezierCurveTo(x-s*0.5, y+s*0.6, x, y+s*0.8, x, y+s);
  ctx.bezierCurveTo(x, y+s*0.8, x+s*0.5, y+s*0.6, x+s*0.5, y+s*0.3); ctx.bezierCurveTo(x+s*0.5, y, x, y, x, y+s*0.3); ctx.closePath(); }
function diamondPath(x,y,s){ ctx.beginPath(); ctx.moveTo(x-s*0.6,y-s*0.25); ctx.lineTo(x-s*0.3,y-s*0.6); ctx.lineTo(x+s*0.3,y-s*0.6);
  ctx.lineTo(x+s*0.6,y-s*0.25); ctx.lineTo(x,y+s*0.65); ctx.closePath(); }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(text, maxW){ const words = text.split(' '); const lines = []; let line = '';
  for (const w of words){ const t = line ? line+' '+w : w; if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines; }

// ---------- level ----------
const SOLIDS = [ {x:0,w:1400}, {x:1520,w:1080}, {x:2720,w:1080}, {x:3920,w:2480} ].map(s => ({x:s.x, y:GROUND, w:s.w, h:200}));
const PLATS = [ [600,350,160],[880,270,150],[1250,330,170],[1800,330,160],[2080,250,150],[2420,330,150],
  [2980,320,200],[3330,240,150],[3680,330,200],[4300,340,160],[4580,260,150],[5350,320,180],[5900,320,180] ].map(p => ({x:p[0],y:p[1],w:p[2],h:20}));
const STARS = []; for (let i=0;i<180;i++) STARS.push({x:rnd(0,W*2), y:rnd(0,380), r:rnd(0.6,2.2), t:rnd(0,6)});
const FLOWERS = []; for (let x=20; x<LEVEL_W; x+=rnd(40,90)) FLOWERS.push({x, c:['#ff7ad9','#ffe35a','#9fd8ff','#ffffff'][Math.floor(rnd(0,4))], h:rnd(8,16)});
const HILLS = []; for (let i=0;i<30;i++) HILLS.push({x:i*260+rnd(-40,40), r:rnd(120,220)});

let state = 'title', T = 0, player, blobs, npcs, diamonds, hearts, lasers, orbs, parts, pops, bubbles, boss, cam, gateOpen, hintT, deadT, winT, paused=false, shake=0;

function newGame(){
  player = {x:150, y:GROUND-104, w:44, h:104, vx:0, vy:0, onGround:false, face:1, fuel:1, inv:0, hearts:3, cool:0, safeX:150, flying:false, anim:0, jumps:0};
  blobs = [ [800,700,1100,'pink'], [1700,1560,2000,'blue'], [2300,1900,2560,'pink'], [3050,2985,3150,'pink',320],
            [3200,2760,3500,'blue'], [3900,3940,4250,'pink'], [4400,4300,4900,'blue'], [4700,4550,4950,'pink'], [4620,4585,4700,'blue',260] ]
    .map(b => ({x:b[0], minX:b[1], maxX:b[2], type:b[3], floor:b[4]||GROUND, w:62, h:58, dir:Math.random()<0.5?-1:1, alive:true, stun:0, t:rnd(0,6), say:0}));
  blobs.forEach(b => b.y = b.floor - b.h);
  npcs = [
    {img:'friend', x:380, w:50, h:110, idx:-1, name:'Friend', lines:["Hi! I'm your best friend!", "Pink blobs: JUMP on their heads!", "Blue blobs: zap them with your LASER! (Z)", "Hold F to fly! Find all 5 missing diamonds!", "And remember... DON'T DIE!"]},
    {img:'pink', x:2850, w:56, h:100, idx:-1, name:'Pinky', lines:["Hello, hero! I'm Pinky!", "One diamond is way up in the sky. Fly up to get it!", "The big cat monster lives at the end.", "You need all 5 diamonds to open the magic gate!", "You can do it! I believe in you!"]}
  ];
  npcs.forEach(n => n.y = GROUND - n.h);
  diamonds = [ [955,225], [1460,380], [2155,205], [3220,95], [4655,215] ].map(d => ({x:d[0], y:d[1], got:false, t:rnd(0,6)}));
  hearts = [ {x:3780, y:290, got:false}, {x:5150, y:420, got:false} ];
  lasers = []; orbs = []; parts = []; pops = []; bubbles = [];
  boss = {x:5950, y:GROUND-200, w:150, h:200, vx:0, vy:0, dir:-1, hp:16, max:16, active:false, defeated:false, atk:2.0, hop:3, flash:0, stun:0, t:0, endT:0};
  cam = 0; gateOpen = false; hintT = 9; deadT = 0; winT = 0; shake = 0;
}
newGame();

// ---------- effects ----------
function burst(x,y,colors,n=16,sp=260){ for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(sp*0.3,sp); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(0.5,1),max:1,c:colors[i%colors.length],r:rnd(3,7)}); } }
function pop(x,y,text,c='#fff'){ pops.push({x,y,text,c,life:1.4}); }
function say(who,text,life=2.8){ bubbles = bubbles.filter(b => b.who !== who); bubbles.push({who,text,life}); }

function hurt(fromX){
  if (player.inv > 0 || state !== 'play') return;
  player.hearts--; player.inv = 1.6; shake = 0.3;
  player.vx = (player.x+player.w/2 < fromX ? -1 : 1) * 380; player.vy = -420;
  SFX.hurt(); burst(player.x+player.w/2, player.y+40, ['#ff4f6d','#ffd0e0'], 12);
  if (player.hearts <= 0){ state = 'dying'; deadT = 1.2; SFX.die(); }
  else pop(player.x+player.w/2, player.y-20, 'Ouch!', '#ff8aa8');
}

// ---------- update ----------
function update(dt){
  T += dt;
  if (pressed.mute){ muted = !muted; }
  if (state === 'title'){ if (pressed.enter){ newGame(); state = 'play'; SFX.gate(); } return; }
  if (state === 'dead' || state === 'win'){ if (pressed.enter){ newGame(); state = 'play'; SFX.gate(); } updateFx(dt); return; }
  if (state === 'dying'){ deadT -= dt; updateFx(dt); if (deadT <= 0) state = 'dead'; return; }
  if (pressed.pause) paused = !paused;
  if (paused) return;
  const p = player;
  hintT -= dt; p.inv = Math.max(0, p.inv - dt); p.cool -= dt; shake = Math.max(0, shake - dt);

  // horizontal
  const dir = (keys.right?1:0) - (keys.left?1:0);
  if (dir) p.face = dir;
  const target = dir * 330;
  p.vx += (target - p.vx) * Math.min(1, dt * (p.onGround ? 14 : 6));
  // jump
  if (pressed.jump && p.onGround){ p.vy = -770; p.onGround = false; SFX.jump(); burst(p.x+p.w/2, p.y+p.h, ['#bfffb0','#ffffff'], 6, 120); }
  if (!keys.jump && p.vy < -300) p.vy += 2400*dt; // short hop when released
  // fly
  p.flying = false;
  if (keys.fly && p.fuel > 0){
    p.flying = true; p.vy = Math.max(-360, p.vy - 3400*dt); p.fuel = Math.max(0, p.fuel - dt/2.6);
    if (Math.random() < 0.6) parts.push({x:p.x+p.w/2+rnd(-10,10), y:p.y+p.h, vx:rnd(-40,40), vy:rnd(80,160), life:0.5, max:0.5, c:['#ffe35a','#ff9bd6','#9fd8ff'][Math.floor(rnd(0,3))], r:rnd(2,5)});
  } else if (p.onGround) p.fuel = Math.min(1, p.fuel + dt*0.7);
  else p.fuel = Math.min(1, p.fuel + dt*0.08);
  p.vy = Math.min(p.vy + 1900*dt, 950);

  // move X
  p.x += p.vx * dt;
  const walls = SOLIDS.slice(); if (!gateOpen) walls.push({x:GATE_X, y:-500, w:30, h:1200});
  for (const s of walls) if (overlap(p, s)){ if (p.vx > 0 || p.x+p.w/2 < s.x) p.x = s.x - p.w; else p.x = s.x + s.w; p.vx = 0; }
  p.x = clamp(p.x, 0, LEVEL_W - p.w);
  // move Y
  const prevB = p.y + p.h; p.y += p.vy * dt; p.onGround = false;
  for (const s of SOLIDS) if (overlap(p, s) && prevB <= s.y + 2){ p.y = s.y - p.h; p.vy = 0; p.onGround = true; }
  if (p.vy >= 0) for (const s of PLATS) if (p.x+p.w > s.x && p.x < s.x+s.w && prevB <= s.y + 2 && p.y+p.h >= s.y){ p.y = s.y - p.h; p.vy = 0; p.onGround = true; }
  if (p.y < -40){ p.y = -40; p.vy = Math.max(p.vy, 0); }
  if (p.onGround){ const g = SOLIDS.find(s => p.x > s.x+20 && p.x+p.w < s.x+s.w-20 && Math.abs(p.y+p.h - s.y) < 2); if (g) p.safeX = p.x; }
  if (p.y > H + 60){ // fell in a gap
    p.inv = 0; hurt(p.x + p.face*100);
    if (state === 'play'){ p.x = p.safeX; p.y = GROUND - p.h - 40; p.vx = 0; p.vy = 0; pop(p.x+p.w/2, p.y-30, 'Whoops! Watch the gaps!', '#ffe35a'); }
  }
  p.anim += Math.abs(p.vx) * dt * 0.03;

  // laser
  if (pressed.laser && p.cool <= 0){
    p.cool = 0.28; SFX.laser();
    lasers.push({x: p.face > 0 ? p.x+p.w : p.x-40, y: p.y + 42, w:40, h:8, vx: p.face*950, life:0.7});
  }
  for (const l of lasers){
    l.x += l.vx * dt; l.life -= dt;
    for (const b of blobs) if (b.alive && overlap(l, b)){
      l.life = 0;
